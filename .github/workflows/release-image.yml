name: Release Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  m1_gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gate deps
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Resolve latest run_id
        id: pick
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(ls -1 reports/m1 2>/dev/null | sort | tail -n 1 || true)"
          if [ -z "$RUN_ID" ]; then
            echo "No reports found under reports/m1" >&2
            exit 1
          fi
          if [ ! -f "reports/m1/$RUN_ID/summary.json" ]; then
            echo "summary.json not found for run_id=$RUN_ID" >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using run_id=$RUN_ID"

      - name: Run M1 gate
        shell: bash
        env:
          MIN_PASS_RATE: "95"
        run: |
          set -euo pipefail
          chmod +x scripts/m1_gate.sh
          ./scripts/m1_gate.sh "${{ steps.pick.outputs.run_id }}"

  docker:
    needs: m1_gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mrkit-go-batch
          tags: |
            type=ref,event=tag
            type=sha
          flavor: |
            latest=true

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
